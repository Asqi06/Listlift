<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ListLift Universal Auto-Fill Agent</title>
    <style>
      body {
        margin: 0;
        width: 350px;
        font-family: system-ui, -apple-system, sans-serif;
        background: #FAF9F5;
        color: #111214;
        padding: 16px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 12px;
        border-bottom: 1px solid #E5E1D8;
      }
      .brand { font-weight: 800; font-size: 15px; }
      .pill {
        font-size: 11px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 6px;
        background: rgba(11, 122, 83, 0.12);
        color: #065F40;
      }
      .card {
        margin-top: 12px;
        padding: 12px;
        background: #FFFFFF;
        border: 1px solid #E5E1D8;
        border-radius: 10px;
      }
      .title { font-weight: 600; font-size: 13px; margin: 0 0 6px; }
      .meta { font-size: 12px; color: #52555E; margin: 0; line-height: 1.4; }
      .btn-row { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
      button {
        width: 100%;
        height: 40px;
        border: none;
        border-radius: 8px;
        background: #0B7A53;
        color: #FFFFFF;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      button.secondary {
        background: #FFFFFF;
        color: #111214;
        border: 1px solid #E5E1D8;
        height: 36px;
        font-size: 12px;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      #status {
        margin-top: 10px;
        font-size: 12px;
        color: #065F40;
        font-weight: 500;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <span class="brand">ListLift Universal Agent</span>
      <span class="pill">v2.1</span>
    </div>
    <div id="content" class="card">
      <p class="title">Checking open ListLift tabs…</p>
      <p class="meta">Generate a listing in ListLift Studio and click "Send to Auto-Fill Agent".</p>
    </div>
    <div class="btn-row">
      <button id="fillBtn" disabled>Auto-Fill Current Tab (Any Site)</button>
      <button id="syncBtn" class="secondary">Pull Latest from Open ListLift Tab</button>
    </div>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
